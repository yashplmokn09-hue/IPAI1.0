<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPAI1.0 — AI Assistant</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0c0e;--surface:#16161a;--card:#1e1e24;--border:#2a2a35;
  --accent:#7c6ff7;--accent2:#4f46e5;--text:#e8e8f0;--muted:#7070a0;
  --user-bg:#1a1830;--user-br:#3d3880;--ai-bg:#16161a;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.logo{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#fff;flex-shrink:0}
.hname{font-weight:700;font-size:15px}
.htag{font-size:10px;color:var(--muted);background:var(--border);padding:2px 8px;border-radius:20px}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade8088;flex-shrink:0}
.api-btn{font-size:11px;color:var(--accent);background:var(--card);border:1px solid var(--border);padding:4px 10px;border-radius:20px;cursor:pointer;text-decoration:none}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:10px;color:var(--muted);text-align:center;padding:32px}
.welcome .wlogo{width:64px;height:64px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:#fff;margin-bottom:8px}
.welcome h2{color:var(--text);font-size:22px;font-weight:700}
.welcome p{font-size:13px;max-width:260px;line-height:1.6}
.caps{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.cap{font-size:11px;padding:4px 10px;border-radius:20px;background:var(--card);border:1px solid var(--border);color:var(--muted)}
.cap.hi{border-color:#1a4a32;color:#4ade80;background:#0f1f18}
.msg{max-width:88%;display:flex;flex-direction:column;gap:3px}
.msg.user{align-self:flex-end}
.msg.assistant{align-self:flex-start}
.msg-label{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
.msg.user .msg-label{text-align:right}
.bubble{padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.65;word-break:break-word;white-space:pre-wrap}
.msg.user .bubble{background:var(--user-bg);border:1px solid var(--user-br)}
.msg.assistant .bubble{background:var(--ai-bg);border:1px solid var(--border)}
.search-indicator{font-size:11px;color:#4ade80;padding:4px 10px;background:#0f1f18;border:1px solid #1a4a32;border-radius:20px;align-self:flex-start;margin-bottom:4px}
.typing{display:flex;gap:4px;align-items:center;padding:14px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bob 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bob{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.inputarea{padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-end;flex-shrink:0}
#inp{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font:14px/1.5 -apple-system,sans-serif;padding:10px 12px;resize:none;outline:none;min-height:40px;max-height:130px}
#inp:focus{border-color:var(--accent)}
#inp::placeholder{color:var(--muted)}
#send{width:40px;height:40px;flex-shrink:0;background:var(--accent);border:none;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
#send:hover{background:#9d96fa}
#send:disabled{background:var(--border);cursor:not-allowed}
#send svg{width:18px;height:18px;fill:#fff}
.err{color:#f87171;font-size:12px;padding:6px 12px;background:#200f0f;border:1px solid #5a2020;border-radius:8px;align-self:flex-start;max-width:88%}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>
<body>
<header>
  <div class="logo">IP</div>
  <span class="hname">IPAI1.0</span>
  <span class="htag">v1.0</span>
  <div class="hright">
    <a class="api-btn" href="apikey.html">Get API Key</a>
    <div class="dot"></div>
  </div>
</header>

<div id="msgs">
  <div class="welcome" id="welcome">
    <div class="wlogo">IP</div>
    <h2>IPAI1.0</h2>
    <p>Your own AI — 7B parameters, real-time internet search, always available.</p>
    <div class="caps">
      <span class="cap hi">🌐 Web search</span>
      <span class="cap hi">📚 Wikipedia</span>
      <span class="cap">💬 Multi-turn chat</span>
      <span class="cap">🔑 Free API</span>
    </div>
  </div>
</div>

<div class="inputarea">
  <textarea id="inp" rows="1" placeholder="Message IPAI1.0..."></textarea>
  <button id="send" onclick="send()">
    <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
  </button>
</div>

<script>
const HF_TOKEN = "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";
const MODEL = "Plmokn09/IPAI1.0";
const CHAT_URL = `https://api-inference.huggingface.co/models/${MODEL}/v1/chat/completions`;
const SYSTEM = "You are IPAI1.0, an AI assistant created by Yash. You are clear, straightforward, helpful, honest and direct. You know about all topics. When you receive real-time information, use it to give accurate and up-to-date answers.";

let busy = false;
let history = [];
const msgsEl = document.getElementById("msgs");
const inpEl = document.getElementById("inp");
const sendBtn = document.getElementById("send");
const welcome = document.getElementById("welcome");

function hideWelcome(){if(welcome)welcome.style.display="none"}

async function webSearch(query) {
  try {
    const q = encodeURIComponent(query);
    const r = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${q}`);
    if(r.ok){
      const d = await r.json();
      if(d.extract) return `Wikipedia: ${d.extract.slice(0,500)}`;
    }
  } catch{}
  try {
    const r = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`);
    if(r.ok){
      const d = await r.json();
      if(d.AbstractText) return `Web: ${d.AbstractText.slice(0,500)}`;
    }
  } catch{}
  return "";
}

function addMsg(role, text){
  hideWelcome();
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  const label = document.createElement("div");
  label.className = "msg-label";
  label.textContent = role === "user" ? "You" : "IPAI1.0";
  const bub = document.createElement("div");
  bub.className = "bubble";
  bub.textContent = text;
  wrap.appendChild(label);
  wrap.appendChild(bub);
  msgsEl.appendChild(wrap);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  return bub;
}

function addSearchIndicator(text){
  hideWelcome();
  const d = document.createElement("div");
  d.className = "search-indicator";
  d.id = "searchInd";
  d.textContent = "🌐 " + text;
  msgsEl.appendChild(d);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  return d;
}

function addTyping(){
  hideWelcome();
  const wrap = document.createElement("div");
  wrap.className = "msg assistant";
  wrap.id = "typing";
  const label = document.createElement("div");
  label.className = "msg-label";
  label.textContent = "IPAI1.0";
  const bub = document.createElement("div");
  bub.className = "bubble";
  bub.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  wrap.appendChild(label);
  wrap.appendChild(bub);
  msgsEl.appendChild(wrap);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  return wrap;
}

function addErr(t){
  const d = document.createElement("div");
  d.className = "err";
  d.textContent = "⚠ " + t;
  msgsEl.appendChild(d);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

async function send(){
  if(busy) return;
  const text = inpEl.value.trim();
  if(!text) return;
  addMsg("user", text);
  history.push({"role":"user","content":text});
  inpEl.value = "";
  inpEl.style.height = "auto";
  busy = true;
  sendBtn.disabled = true;

  // Search internet
  const searchInd = addSearchIndicator("Searching internet...");
  const searchResult = await webSearch(text);
  searchInd.remove();

  if(searchResult){
    const ind = addSearchIndicator("Found real-time info ✓");
    setTimeout(()=>ind.remove(), 2000);
  }

  const typing = addTyping();

  try {
    const systemContent = SYSTEM + (searchResult ? `\n\nReal-time information:\n${searchResult}` : "");
    const messages = [{"role":"system","content":systemContent}, ...history];
    const res = await fetch(CHAT_URL, {
      method: "POST",
      headers: {"Authorization":`Bearer ${HF_TOKEN}`,"Content-Type":"application/json"},
      body: JSON.stringify({model:MODEL, messages, max_tokens:512, temperature:0.7, stream:false})
    });
    typing.remove();
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      addErr(err.error?.message || `Error ${res.status} — try again`);
    } else {
      const data = await res.json();
      const reply = data.choices?.[0]?.message?.content || "(empty)";
      addMsg("assistant", reply);
      history.push({"role":"assistant","content":reply});
    }
  } catch(e){
    typing.remove();
    addErr("Connection error. Please try again.");
  }
  busy = false;
  sendBtn.disabled = false;
  inpEl.focus();
}

inpEl.addEventListener("input",()=>{
  inpEl.style.height="auto";
  inpEl.style.height=Math.min(inpEl.scrollHeight,130)+"px";
});
inpEl.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}
});
</script>
</body>
</html>
